events {
    # 💡 サーバー目線強化：group_vars/all.yml の nginx_worker_connections と完全同期
    # 100人以上のバーストトラフィックや同時並行のソケット維持を余裕で捌くキャパシティに拡張
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log  warn;

    # 💡 【サーバー目線解決：メモリ空間と受付レートの定義】
    # group_vars/all.yml の nginx_rate_limit_rate (100r/s) と完全同期。
    # 100人から同時にミリ秒単位で押し寄せるPOST通信を、手前のフィルターで溢れさせることなく100%受け止めます。
    limit_req_zone $binary_remote_addr zone=noc_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        location / {
            # 💡 【サーバー目線解決：バーストキューと遅延なし転送の適用】
            # group_vars/all.yml の nginx_rate_limit_burst (120) と完全同期。
            # 100人が一斉に操作した瞬間の急激なスパイク負荷を120要求まで一時的なキュー（並びの列）に保持し、
            # かつ「nodelay」を指定することで、Next.js（3000ポート）側へ待たせることなく即座にPOSTデータをリレーします。
            limit_req zone=noc_limit burst=120 nodelay;

            proxy_pass http://nextjs_app:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}