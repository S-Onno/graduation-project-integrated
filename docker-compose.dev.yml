# =============================================================================
# 開発班ローカル専用 Docker Compose
#
#   起動: docker compose -f docker-compose.dev.yml up -d --build
#   停止: docker compose -f docker-compose.dev.yml down
#   確認: http://localhost:8080
#
# サーバー用の構成はインフラ班の app/templates/app_docker-compose.yml.j2（Ansible）
# が正であり、このファイルはローカル確認のためだけに使う。
# イメージのバージョンは app/defaults/main.yml に合わせること。
# パスワード等はローカル専用のダミー値（本番では使わない）。
# =============================================================================

name: zootask-dev

services:
  # ---------------------------------------------------------------------------
  # 1. Nginx リバースプロキシ（http://localhost:8080 → nextjs_app:3000）
  # ---------------------------------------------------------------------------
  web_server:
    image: nginx:1.30.6-alpine
    container_name: web_server
    ports:
      - "8080:80"
    volumes:
      - ./dev/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nextjs_app:
        condition: service_started
    networks:
      - app_frontend_net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Next.js アプリケーション（起動時に Prisma マイグレーションを自動適用）
  # ---------------------------------------------------------------------------
  nextjs_app:
    build:
      context: ./app/files/nextjs_app
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "node:22.23.4-alpine"
    container_name: nextjs_app
    environment:
      TZ: "Asia/Tokyo"
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgres@postgres_db:5432/app_db?schema=public"
      NEXTAUTH_SECRET: "Qz+QChHEkWWTOO2w4/YPRnRNrcM2yla552loudN3ax8="
      NEXTAUTH_URL: "http://localhost:8080"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app_frontend_net
      - app_backend_net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. PostgreSQL（データは dev/postgres_db_data に保存、git 管理外）
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgres:16.15-alpine
    container_name: postgres_db
    environment:
      TZ: "Asia/Tokyo"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "app_db"
    ports:
      - "5432:5432"
    volumes:
      - ./dev/postgres_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - app_backend_net
    restart: unless-stopped

networks:
  app_frontend_net:
    driver: bridge
  app_backend_net:
    driver: bridge
