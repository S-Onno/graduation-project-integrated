version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Nginx リバースプロキシ
  # ----------------------------------------------------------------------------
  web_server:
    image: nginx:1.25-alpine
    container_name: web_server
    ports:
      - "8080:80"
    volumes:
      - ../files/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nextjs_app:
        condition: service_started
    networks:
      - app_frontend_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Next.js 15 アプリケーション（ローカル対応・自律マイグレーション版）
  # ----------------------------------------------------------------------------
  nextjs_app:
    build:
      context: ../files/nextjs_app
      dockerfile: Dockerfile
      args:
        DATABASE_URL: 'postgresql://postgres:postgres@postgres_db:5432/app_db?schema=public'
    container_name: nextjs_app
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: 'postgresql://postgres:postgres@postgres_db:5432/app_db?schema=public'
      NEXTAUTH_SECRET: 'Qz+QChHEkWWTOO2w4/YPRnRNrcM2yla552loudN3ax8='
      NEXTAUTH_URL: 'http://localhost:8080'
    depends_on:
      postgres_db:
        condition: service_healthy
    command: [ "sh", "-c", "node node_modules/prisma/build/index.js migrate deploy --schema=./prisma/schema.prisma && node server.js" ]
    networks:
      - app_frontend_net
      - app_backend_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL データベース
  # ----------------------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'app_db'
    ports:
      - "5432:5432"
    networks:
      - app_backend_net
    volumes:
      - ./postgres_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d app_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_frontend_net:
    driver: bridge
  app_backend_net:
    driver: bridge