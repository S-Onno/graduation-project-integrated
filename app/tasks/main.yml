# 冪等性・ハングアップ・SELinux完全対策版
---
# [infrastructure-repo-iac-secure] roles/app/tasks/main.yml
# =========================================================================
# 🎓 卒業制作: Server B アプリ基盤＆高パフォーマンスIaCマスタータスク
# =========================================================================

# -----------------------------------------------------------------
# 1. 【カーネルチューニング】バースト接続を受け止めるOSソケット拡張
# -----------------------------------------------------------------
- name: "app : [カーネル調整] 同時アクセスを受け止めるソケットバックログの拡張"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value | string }}"
    state: present
    reload: true
  loop:
    - { name: 'net.core.somaxconn', value: "{{ sysctl_somaxconn | default(2048) }}" }
    - { name: 'net.ipv4.tcp_max_syn_backlog', value: "{{ sysctl_tcp_max_syn_backlog | default(2048) }}" }
    - { name: 'net.core.netdev_max_backlog', value: "{{ sysctl_netdev_max_backlog | default(2048) }}" }

# -----------------------------------------------------------------
# 2. ディレクトリ構造整備 ＆ SELinux事前防御
# -----------------------------------------------------------------
- name: "app : [ディレクトリ作成] Docker Compose展開用ベースディレクトリの生成"
  ansible.builtin.file:
    path: "{{ app_base_dir | default('/opt/app') }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: "app : [ディレクトリ作成] PostgreSQLデータ保存用ディレクトリの作成"
  ansible.builtin.file:
    path: "{{ app_pg_data_path | default('/opt/app/postgres_data') }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
    setype: container_file_t

- name: "app : [ディレクトリ作成] アプリソース展開先階層の生成"
  ansible.builtin.file:
    path: "{{ app_base_dir | default('/opt/app') }}/nextjs_app"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: "app : [ディレクトリ作成] SSL証明書保存用ディレクトリの生成"
  ansible.builtin.file:
    path: "{{ app_ssl_dir | default('/opt/app/ssl') }}"
    state: directory
    mode: '0700'
    owner: root
    group: root
    setype: container_file_t

# -----------------------------------------------------------------
# 2.5 SSL/TLS 暗号化基盤（IPアドレス直接指定対応 TLS自己署名証明書）
# -----------------------------------------------------------------
- name: "app : [SSLモード通知] IP直接指定用 TLS自己署名証明書 (SAN対応) の適用"
  ansible.builtin.debug:
    msg: "🔒 [IP直接運用] ドメイン完全非依存モード。ホストIP ({{ ansible_host | default(ansible_default_ipv4.address) }}) をSANに含む高強度TLS証明書を適用します。"

- name: "app : [SSL検証] 既存自己署名SSL証明書の有効期限検査 (残り30日以上あるか検証)"
  ansible.builtin.command: >
    openssl x509 -checkend 2592000 -noout -in {{ app_ssl_dir | default('/opt/app/ssl') }}/fullchain.pem
  register: self_signed_cert_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: "app : [SSL生成] OpenSSL による自己署名TLS証明書 (実IPアドレス SAN対応) の生成・更新"
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout {{ app_ssl_dir | default('/opt/app/ssl') }}/privkey.pem
    -out {{ app_ssl_dir | default('/opt/app/ssl') }}/fullchain.pem
    -subj "/C=JP/ST=Tokyo/O=ZooTask/CN={{ ansible_host | default(ansible_default_ipv4.address) }}"
    -addext "subjectAltName = IP:{{ ansible_host | default(ansible_default_ipv4.address) }}, IP:127.0.0.1, DNS:localhost"
  when: (self_signed_cert_check.rc | default(1)) != 0

- name: "app : [SSLパーミッション] 証明書および秘密鍵の安全な権限設定 (0600)"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
    group: root
  loop:
    - "{{ app_ssl_dir | default('/opt/app/ssl') }}/fullchain.pem"
    - "{{ app_ssl_dir | default('/opt/app/ssl') }}/privkey.pem"

# -----------------------------------------------------------------
# 3. アセット配布 ＆ 設定同期 (シークレット保護 ＆ .env安全退避・自動生成)
# -----------------------------------------------------------------
- name: "app : [機密保護] 既存 .env ファイルの存在確認"
  ansible.builtin.stat:
    path: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/.env"
  register: existing_env_stat

- name: "app : [機密保護: 退避] Git更新前に既存 .env を一時バックアップ領域へ退避"
  ansible.builtin.copy:
    src: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/.env"
    dest: "/tmp/nextjs_env_saved.env"
    remote_src: true
    mode: '0600'
  when: existing_env_stat.stat.exists

- name: "app : [アセット配布: Local] 司令塔のソースコード・設定アセットをServer Bへ配布"
  ansible.builtin.copy:
    src: "nextjs_app/"
    dest: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/"
    mode: '0644'
    directory_mode: '0755'
  register: app_source_update_local
  when: app_source_method | default('local') == 'local'

- name: "app : [Gitワークスペース] アプリリポジトリ専用クローン領域の作成"
  ansible.builtin.file:
    path: "/opt/app_git_workspace"
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: app_source_method | default('local') == 'git'

- name: "app : [アセット配布: Git] GitHubリポジトリからNext.jsアプリソースを取得"
  ansible.builtin.git:
    repo: "{{ app_git_repo | default('https://github.com/S-Onno/graduation-project-integrated.git') }}"
    dest: "/opt/app_git_workspace"
    version: "{{ app_git_version | default('main') }}"
    force: true
  register: app_source_update_git
  when: app_source_method | default('local') == 'git'

- name: "app : [アセット同期: Git] アプリ本体ソース (app/files/nextjs_app) を展開領域へ安全同期"
  ansible.builtin.shell: >
    cp -a /opt/app_git_workspace/app/files/nextjs_app/. {{ app_base_dir | default('/opt/app') }}/nextjs_app/
  register: app_source_sync_res
  changed_when: app_source_update_git.changed | default(false)
  when: app_source_method | default('local') == 'git'

- name: "app : [コンテナ定義補完] IaC最適化 Dockerfile および .dockerignore の確実な配備"
  ansible.builtin.copy:
    src: "nextjs_app/{{ item }}"
    dest: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/{{ item }}"
    mode: '0644'
    owner: root
    group: root
  loop:
    - Dockerfile
    - .dockerignore
  register: app_dockerfile_sync

- name: "app : [ディレクトリ保証] src ディレクトリの存在保証"
  ansible.builtin.file:
    path: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/src"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: "app : [機密保護: 復元] 退避済み既存 .env の復元配置"
  ansible.builtin.copy:
    src: "/tmp/nextjs_env_saved.env"
    dest: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/.env"
    remote_src: true
    mode: '0600'
    owner: root
    group: root
  when: existing_env_stat.stat.exists
  register: restored_env_res

- name: "app : [機密保護: 初回自動生成] .env 未存在時はAnsible VaultからIP直結用環境変数を生成配置"
  ansible.builtin.template:
    src: nextjs_env.j2
    dest: "{{ app_base_dir | default('/opt/app') }}/nextjs_app/.env"
    mode: '0600'
    owner: root
    group: root
  no_log: true
  when: not existing_env_stat.stat.exists
  register: generated_env_res

- name: "app : [機密保護: 一時ファイル消去] 退避用一時 .env の安全消去"
  ansible.builtin.file:
    path: "/tmp/nextjs_env_saved.env"
    state: absent

- name: "app : [更新フラグ統合] アプリソース更新状態の確定"
  ansible.builtin.set_fact:
    app_source_changed: "{{ (app_source_update_local.changed | default(false)) or (app_source_update_git.changed | default(false)) or (generated_env_res.changed | default(false)) or (app_dockerfile_sync.changed | default(false)) }}"

- name: "app : [設定配布] Nginx設定ファイルをServer Bへ同期配布"
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "{{ app_base_dir | default('/opt/app') }}/nginx.conf"
    mode: '0644'
  register: app_nginx_conf_update

- name: "app : [テンプレート配布] Docker Compose 定義ファイルの安全配置"
  ansible.builtin.template:
    src: app_docker-compose.yml.j2
    dest: "{{ app_base_dir | default('/opt/app') }}/docker-compose.yml"
    mode: '0600'
  no_log: true
  register: compose_manifest

- name: "app : [SELinuxポリシー] アプリ・DB領域のコンテキスト定義をSELinuxへ事前登録 (Python 3.12統一・完全冪等CLI)"
  ansible.builtin.shell: |
    set -e
    # SELinux が無効の場合はスキップ
    if ! command -v getenforce >/dev/null 2>&1 || [ "$(getenforce 2>/dev/null)" = "Disabled" ]; then
      echo "ok"
      exit 0
    fi
    SEMANAGE_EXEC="semanage"
    if [ -f /usr/sbin/semanage ] && command -v python3.9 >/dev/null 2>&1; then
      SEMANAGE_EXEC="python3.9 /usr/sbin/semanage"
    fi
    TARGET_REGEX="{{ app_base_dir | default('/opt/app') }}(/.*)?"
    # 既に登録済みの場合はスキップ
    if ${SEMANAGE_EXEC} fcontext -l | grep -F "${TARGET_REGEX}" | grep -q "container_file_t"; then
      echo "ok"
    else
      ${SEMANAGE_EXEC} fcontext -a -t container_file_t "${TARGET_REGEX}"
      restorecon -R "{{ app_base_dir | default('/opt/app') }}"
      echo "changed"
    fi
  register: app_sefcontext_res
  changed_when: "'changed' in app_sefcontext_res.stdout"
  become: true

# -----------------------------------------------------------------
# 4. コンテナ一括デプロイ ＆ ヘルスチェック検証 (完全冪等性保証)
# -----------------------------------------------------------------
- name: "app : [状態検査] 稼働中コンテナの状態を事前取得"
  ansible.builtin.command:
    cmd: "docker inspect --format {% raw %}'{{.State.Status}}'{% endraw %} nextjs_app"
  register: nextjs_existing_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: "app : [再構築要否判定] ソース・設定変更またはコンテナ未起動を検知"
  ansible.builtin.set_fact:
    app_rebuild_required: "{{ app_source_changed | default(false) or compose_manifest.changed | default(false) or app_nginx_conf_update.changed | default(false) or (nextjs_existing_check.rc != 0) }}"

- name: "app : [ベース取得] Next.js ビルド用ベースイメージ (node:{{ version_image_node | default('22.23.4-alpine') }}) の事前取得"
  ansible.builtin.command:
    cmd: "docker pull node:{{ version_image_node | default('22.23.4-alpine') }}"
  register: node_pull_res
  until: node_pull_res is not failed
  retries: 5
  delay: 6
  when: app_rebuild_required | bool
  changed_when: '"Downloaded newer image" in node_pull_res.stdout'

- name: "app : [Composeビルド] Next.js アプリケーションイメージのビルド"
  ansible.builtin.command:
    cmd: "docker compose build"
    chdir: "{{ app_base_dir | default('/opt/app') }}"
  environment:
    DOCKER_BUILDKIT: "1"
    COMPOSE_DOCKER_CLI_BUILD: "1"
  register: app_build_res
  async: 900
  poll: 5
  when: app_rebuild_required | bool
  changed_when: '"writing image" in app_build_res.stderr or "naming to" in app_build_res.stderr'

- name: "app : [Composeデプロイ] Next.js ＆ PostgreSQL バックグラウンド起動"
  ansible.builtin.command:
    cmd: "docker compose up -d --remove-orphans"
    chdir: "{{ app_base_dir | default('/opt/app') }}"
  register: app_compose_res
  async: 300
  poll: 5
  when: app_rebuild_required | bool
  changed_when: '"Started" in app_compose_res.stdout or "Created" in app_compose_res.stdout or "Recreated" in app_compose_res.stdout or "Started" in app_compose_res.stderr or "Created" in app_compose_res.stderr or "Recreated" in app_compose_res.stderr'

- name: "app : [健全性待機] postgres_db の内部初期化完了（Healthy状態）を検知"
  ansible.builtin.command:
    cmd: "docker inspect --format {% raw %}'{{.State.Health.Status}}'{% endraw %} postgres_db"
  register: db_health_cmd
  until: db_health_cmd.stdout == "healthy"
  retries: 30
  delay: 2
  changed_when: false
  check_mode: false


- name: "app : [健全性待機] nextjs_app コンテナの稼働開始（running状態）を検知"
  ansible.builtin.command:
    cmd: "docker inspect --format {% raw %}'{{.State.Status}}'{% endraw %} nextjs_app"
  register: nextjs_status_cmd
  until: nextjs_status_cmd.stdout == "running"
  retries: 20
  delay: 1
  changed_when: false
  check_mode: false

- name: "app : [ウォームアップ待機] Webプロキシの疎通準備完了を確認 (HTTP 80 / HTTPS 443)"
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ item }}"
    state: started
    delay: 0
    timeout: 30
  loop:
    - "{{ app_http_port | default(80) }}"
    - "{{ app_https_port | default(443) }}"

- name: "app : [ウォームアップ実行: HTTP] HTTP(80) から HTTPS(443) への 301 リダイレクト検証"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port | default(80) }}/"
    method: GET
    status_code: [301, 302, 307]
    follow_redirects: none
  register: warmup_http_result
  until: warmup_http_result.status in [301, 302, 307]
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false

- name: "app : [ウォームアップ実行: HTTPS] HTTPS(443) への暗号化通信および Next.js レスポンス検証"
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ app_https_port | default(443) }}/"
    method: GET
    status_code: [200, 307, 308]
    validate_certs: false
  register: warmup_https_result
  until: warmup_https_result.status in [200, 307, 308]
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false